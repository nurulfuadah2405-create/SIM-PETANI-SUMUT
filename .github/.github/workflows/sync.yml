name: SIM-PETANI Automatic Synchronization

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sim-petani-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DB_KARO: ${{ secrets.DB_KARO }}
      DB_DELI: ${{ secrets.DB_DELI }}
      DB_LANGKAT: ${{ secrets.DB_LANGKAT }}
      DB_PUSAT: ${{ secrets.DB_PUSAT }}

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Synchronize databases
        run: python sync.py
